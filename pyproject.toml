
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cqd"
version = "1.0.0"
description = "Computational Quantum Dynamics course taught by Prof. Gärttner SS2026"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "qutip",
    "qiskit",
    "pylatexenc", 
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
omit = [
    "src/cqd/__init__.py", 
]